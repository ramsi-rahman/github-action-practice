# workflow[No intendation required for naming a workflow]
# should have name
name: Hello

# on tells when the workflow should run[give intendation]
on:
  workflow_dispatch: 
# jobs
# should be inside the workflow

# jobs tell what the workflow should do, there can be one or more than one jobs
# jobs is a object so intendation is needed
jobs:
  # 1st job[give intendation]
  say-hello:
    # create an ephermal Container with ubuntu running
    runs-on: ubuntu-latest
    # that ephermal container will have steps to execute, hence name those steps and use run: has the command
    steps:
      - name: say hello to everyone
        run: echo "hello guys"
# steps
# should be inside the job

# actions
# should be inside step
